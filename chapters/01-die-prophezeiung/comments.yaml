    weiter Eimer die Sache abrunden würde.


    „Du hast gesagt, die Ziege sei verzaubert“, sagte sie.


    „War sie auch.“


    Sie war es nicht.


    „Sie hat mich angesehen, als wüsste sie etwas.“


    Das tat die Ziege. Ziegen sehen grundsätzlich aus, als wüssten sie etwas. Meistens wissen sie, wo der nächste
    Stiefel steht, auf den man koten kann.


    „Halt dich da raus“, murmelte Taron.


    Elva blinzelte. „Mit wem redest du?“


    „Mit niemandem.“


    Das war gelogen, wenn auch verständlic
