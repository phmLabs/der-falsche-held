name: Taron Falkenried
role: Protagonist
traits: >-
  Taron Falkenried ist siebzehn Jahre alt und Stallbursche auf Burg Waldkirch.

  Er kennt seine Eltern nicht und kam als kleines Kind auf die Burg.

  Als Kind hörte er eine Stimme, die für ihn wie ein unsichtbarer Freund war.

  Nach der Zwergenschlacht verschwand diese Stimme, bis sie am Tag der Prophezeiung zurückkehrte.

  Durch einen Eimer Ziegenmilch, seinen Namen und mehrere Missverständnisse wird Taron für den Auserwählten gehalten.

  Er bestreitet das ständig, wodurch alle nur noch fester an seine Bestimmung glauben.

  Taron ist sarkastisch, vorsichtig, praktisch veranlagt und hat ein sehr gesundes Misstrauen gegenüber Heldentum.

  Er will eigentlich nur überleben, in den Stall zurück und nicht von Monstern, Prophezeiungen oder Priestern benutzt
  werden.

  Trotzdem hat er ein gutes Herz und beginnt langsam zu begreifen, dass es vielleicht nicht wichtig ist, ob er wirklich
  auserwählt ist.

  Außerdem liebt er Elva, das Mädchen, das ihm die Milch über den Kopf geschüttet hat, will darüber aber gerade wirklich
  nicht nachdenken.
