description: |-
  Taron Falkenried ist ein siebzehnjähriger Stalljunge auf Burg Waldkirch im Königreich Lichtenhain. Er kennt seine Eltern nicht, hat aber als Kind eine Stimme gehört, die damals eher Freund als Spottfigur war. Nach dem Zwergenkrieg vor zehn Jahren verschwand diese Stimme. Am Tag, an dem Taron durch Ziegenmilch, seinen Namen und eine sehr bequeme Prophezeiungsauslegung für den Auserwählten gehalten wird, kehrt sie zurück: kühl, trocken, allwissend, nervig.
  Um zu beweisen, dass Taron der Auserwählte ist, werfen ihn König Albrecht und Bruder Malchior in den Dungeon zum Hunger von Waldkirch. Taron kann nur verlieren, wird beinahe getötet und plötzlich wegtransportiert. Er wacht im Haus der gutmütigen Marta Grubenlicht auf, die von einem fremden Mann ein Goldstück bekommen hat, damit sie ihn pflegt. Ihre Beschreibung erinnert Taron stark an den Erzähler, was eigentlich unmöglich sein sollte.
  Taron kehrt zur Burg zurück und will beweisen, dass seine Flucht aus dem Dungeon gerade kein Heldentum war. Natürlich wird genau das als größter Beweis seiner Auserwähltheit gedeutet. Der König stattet ihn schlecht mit den besten übrigen Sachen aus und schickt ihn los, um den ersten Splitter der Nachtkrone am Turm von Abendriss zu bergen.
  Eine Rückblende zeigt die Zwergenkriege vor zehn Jahren. Damals war Waldkirch noch stärker, die Ritter professioneller und Tarons Stimme warm und beschützend. Die Zwerge griffen an, zogen sich aber nach dem Klang ihres Kriegshorns zurück. Die Menschen hielten das für Flucht; später wird klar, dass die Zwerge gefunden hatten, wonach sie suchten. Kurz danach verschwand Tarons Stimme.
  In der Gegenwart beschließt Taron, der Sache eine Chance zu geben. Sein Plan ist lächerlich einfach: hinreiten, Splitter finden, rausgehen. Auf dem Weg gesteht er sich seine Liebe zu Elva ein, will aber nicht daran denken. In Hohensteg trifft er den gutaussehenden, starken, betrunkenen Ritter Sir Oswin von Hohenklamm, der im Suff zusagt, ihn zu begleiten. Am Morgen sagt Oswin nur: „Nicht schon wieder.“
  Oswin ist ein echter Ritter, vom Krieg gezeichnet, ein Weiberheld und sehr gut im Kämpfen. Er zählt die Bösen, die er getötet hat: 248, vielleicht 249. Er schlägt vor, einen Zauberer zu suchen. Sie finden Merlan Graufinger, der vom Dorf zwar Zauberer genannt wird, aber eigentlich Prophezeiungsgelehrter und Stoffkundiger ist.
  Merlan erklärt, dass heutige Magie oft nur seltene Chemie ist: Kräuter, Salze, Rauch, Hitze, Reaktionen. Das heißt aber nicht, dass echte Magie nicht existiert. Er glaubt an Prophezeiungen, aber nicht an schlechte Auslegung. Er liest die Waldkircher Prophezeiung neu und stellt fest: Taron ist nicht als großer Held gemeint, sondern als jemand ohne Machtlinie, Orden oder Anspruch. Außerdem braucht er nicht einen Splitter, sondern drei. Taron ist wütend; der Erzähler macht sich über seinen einfachen Plan lustig.
  Merlan erwähnt nebenbei alte Wesen, Eidträger und Schutzmächte, ohne direkt auf Tarons Erzähler zu zeigen. Er gibt Taron außerdem eine seltene, aber nichtmagische Rauchbombe mit. Oswin kennt solche Mittel aus den Zwergenkriegen und weiß, dass sie über Sieg oder Niederlage entscheiden können. Taron hebt sie später trotzdem ständig auf, weil der nächste Moment ja noch schlimmer sein könnte. Oswin wird darüber immer wütender.
  Die Splitter der Nachtkrone sind nicht einfach Artefakte. Sie sind Bruchstücke eines Gefängnisses, in dem ein böser Schutzdämon eingeschlossen wurde. Der Zwergenkönig hört ebenfalls eine Stimme, eine Art bösen Erzähler. Diese Stimme schützt nicht, sondern kontrolliert, verdreht und verhärtet. Sie hat die Zwerge dazu gebracht, nach den Splittern zu suchen, weil sie glauben, nur so ihr Volk zu retten.
  Beim ersten Splitter merkt Tarons Erzähler dessen verdorbene Ausstrahlung und wird ungewöhnlich still. Er darf Taron aber nicht alles sagen, weil er an einen alten Eid gebunden ist. Wenn er bestimmte Wahrheiten einfach ausspricht, muss er seinen Wirt verlassen, also Taron. Das erklärt später, warum er so viel verschweigt.
  Auf der Reise begegnen Taron und Oswin weiteren Figuren: Mira von Graufurt, die eigentlich viel eher wie eine echte Auserwählte wirkt, und Elva, die später dazukommt und Tarons emotionaler Anker bleibt. In Graumark und Ellingen erkennen sie, dass die Zwerge nicht nur Eroberer sind, sondern selbst gelenkt wurden. Brokk, ein Zwergenhauptmann, erklärt, dass der Zwergenkönig seit Jahren einer Stimme folgt.
  Die Gruppe sammelt die drei Splitter. Merlan deutet sie später erneut und erkennt mehr über Schutzdämonen, Eidträger und die alte Ordnung. Taron erfährt, dass sein Erzähler kein eingebildeter Kommentar ist, sondern ein Schutzdämon. Der Erzähler ist nicht allmächtig: Er kann direkt eingreifen, aber nur unter hohem Preis. Wenn er Taron übernimmt, schwächt ihn das massiv.
  Am Ende kehren alle nach Waldkirch zurück, während Menschen und Zwerge kurz vor der Schlacht stehen. Unter der Burg finden sie den Eidstein, ein altes Artefakt eines Friedensbundes zwischen Menschen, Zwergen und Schutzmächten. Der Zwergenkönig bekommt die drei Splitter. Als sie zusammenkommen, wird der böse Erzähler/Dämon frei. Der Zwergenkönig bricht bewusstlos zusammen, und die Zwerge glauben, die Menschen hätten ihn getötet.
  Die Schlacht eskaliert wild. Taron nutzt endlich Merlans Rauchbombe, nicht heldisch, sondern zur Flucht. In der Kammer des Eidsteins gerät er außerdem in eine ausweglose Lage. Der Erzähler übernimmt Taron mit einem gewaltigen Schutzzauber: Die Luft wird still, jedes Wort klingt wie ein Urteil, und alle Feinde im Raum sterben gleichzeitig. Danach ist der Erzähler sichtbar geschwächt. Taron ist wütend, weil er diese Macht früher gebraucht hätte.
  Als der Zwergenkönig wieder erwacht, ist die fremde Stimme fort. Er begreift, wie sehr er fehlgeleitet wurde, und befiehlt seinen Leuten, die Waffen fallen zu lassen. Dadurch endet die Schlacht, nicht durch einen großen Friedenszauber, sondern durch einen bewussten Befehl eines Königs, der endlich wieder selbst denkt.
  Das Buch endet ruhiger. Menschen und Zwerge sitzen zusammen und versuchen zu verstehen, was mit den Splittern, dem Zwergenkönig und den beiden Stimmen passiert ist. Taron ist wütend auf den Erzähler, weil er nicht früher vor dem Dämon gewarnt hat. Der Erzähler gesteht, dass ein Eidbruch ihn gezwungen hätte, Taron zu verlassen. Dann behauptet er natürlich trotzdem, alles sei geplant gewesen. Der böse Erzähler ist frei und verschwunden, wodurch Band zwei vorbereitet wird: Taron und die anderen könnten nach dem Gefängnis oder Ursprung des guten Schutzdämons suchen und lernen, dass dessen wahre Stärke nicht im Kampf liegt, sondern darin, Menschen und Völker zu verbinden.
