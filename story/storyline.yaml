  description: Taron traf den trinkfesten, gefährlichen Ritter Sir Oswin von Hohenklamm, der vorschlug, einen Zauberer mitzunehmen; der Erzähler übertönte Tarons Widerrede, und der Wirt warf beiläufig Merlan Graufinger ins Spiel. Zwischen Pose und Können zeigte sich Oswins Kriegsinstinkt.
  status: draft
