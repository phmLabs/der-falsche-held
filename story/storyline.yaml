- slug: 06-taron-barg-den-menschenschluessel-am-turm
  title: Taron barg den Menschenschlüssel am Turm
  description: Am Turm von Abendriss fanden Taron und Oswin den Menschenschlüssel; die Ausstrahlung ließ den Erzähler ungewohnt still werden. Er durfte wesentliche Wahrheiten nicht direkt sagen, da ihn ein Eid band, und deutete nur die dunkle Zugehörigkeit der Schlüssel zu etwas Größerem an.
