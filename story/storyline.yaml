- slug: 09-das-eidenschloss-wurde-unter-waldkirch-geoeffnet
  title: Das Eidenschloss wurde unter Waldkirch geöffnet
  description: Am Eidenschloss trafen alle drei Schlüssel zusammen, der böse Dämon wurde frei, und der Zwergenkönig brach bewusstlos zusammen; die Zwerge hielten die Menschen für Mörder und die Schlacht entflammte. Genau in dem Moment, da Einsicht möglich gewesen wäre, überrollte Manipulation die Vernunft.
  status: draft
  goals:
