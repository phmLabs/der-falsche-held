description: "# Der Falsche Held - Handlung\n\n## Grundstruktur\n\nTaron Falkenried wird durch eine missverstandene Prophezeiung fuer den Auserwaehlten gehalten. Je staerker er bestreitet, der Held zu sein, desto deutlicher sehen die Menschen darin ein Zeichen seiner Demut. Die Geschichte folgt seinem Versuch, das Missverstaendnis loszuwerden, waehrend er Schritt fuer Schritt in genau jene Rolle gedraengt wird, die er nie haben wollte.\n\nDer Erzaehler kommentiert alles kuehl und trocken. Taron kann ihn hoeren, hat diese Stimme aber seit seiner Kindheit verdraengt. Am Tag der Prophezeiung kehrt sie zurueck.\n\n---\n\n## Anfang: Der Beweis\n\nNachdem Taron auf Burg Waldkirch fuer den Auserwaehlten gehalten wird, verlangen die Priester und Ritter einen Beweis. Der Beweis ist, wie viele Beweise in alten Reichen, erstaunlich schlecht durchdacht.\n\nTaron soll in ein altes Dungeon unter der Burg geworfen werden, um dort ein uebermaechtiges Monster zu bezwingen. Offiziell ist dies eine heilige Pruefung. Praktisch ist es eine Hinrichtung mit besserer Beleuchtung.\n\nDer Erzaehler kommentiert die Szene mit kalter Sachlichkeit und behauptet nebenbei, Taron habe \"ausgezeichnete Chancen\", wobei er erst nach einer Pause hinzufuegt, dass er damit die Chancen meint, in mehreren Stuecken gefunden zu werden.\n\n### Funktion der Szene\n\n- Taron kann nur verlieren.\n- Die Obrigkeit benutzt den Beweis, um entweder einen Helden zu bestaetigen oder ein peinliches Missverstaendnis verschwinden zu lassen.\n- Taron begreift, dass niemand ernsthaft vorhat, ihm zuzuhören.\n- Der Erzaehler wirkt grausam und spöttisch, hilft aber verdeckt dabei, dass Taron lange genug ueberlebt.\n\n---\n\n## Das Monster\n\nDas Monster im Dungeon sollte deutlich zu stark fuer Taron sein. Es ist kein fairer Gegner, sondern eine uralte Kreatur, die seit Jahren weggesperrt ist und nur deshalb nicht laengst alle getoetet hat, weil die Tuer sehr dick ist.\n\n**Arbeitsname:** Der Hunger von Waldkirch  \n**Art:** Uraltes Dungeon-Monster, halb Bestie, halb magischer Fluch  \n**Wirkung:** Es soll nicht nur physisch bedrohlich sein, sondern Taron auch das Gefuehl geben, dass die Welt ihn bereits abgeschrieben hat.\n\nMoegliche Eigenschaften:\n\n- Reagiert auf Angst.\n- Kann im Dunkeln fast lautlos kriechen.\n- Ist viel zu gross fuer die Gaenge, bewegt sich aber trotzdem darin.\n- Traegt alte Wunden von frueheren \"Pruefungen\".\n- Ist vielleicht selbst ein Opfer der Burg oder des Ordens.\n\n---\n\n## Tarons Zusammenbruch\n\nTaron kaempft nicht heldenhaft. Er rennt, stolpert, wirft Dinge, versteckt sich, betet aus Versehen zu den falschen Heiligen und widerspricht dem Erzaehler, der seine Chancen weiterhin unhilfreich zusammenfasst.\n\nAm Ende ist Taron fast am Ende seiner Kraefte. Seine Energie ist beinahe auf null. Er liegt verletzt im Dungeon und glaubt, dass er stirbt. Das Monster kommt naeher.\n\nKurz bevor es ihn erreicht, wird Taron wegtransportiert.\n\nFuer ihn fuehlt sich der Moment wie Tod an: Dunkelheit, Schmerz, ploetzliche Stille. Er ist sicher, dass sein Leben vorbei ist.\n\n---\n\n## Das Erwachen\n\nTaron wacht nicht im Jenseits auf, sondern in einem kleinen Haus ausserhalb von Burg Waldkirch. Es riecht nach Suppe, Rauch, altem Holz und Kraeutern, die vermutlich medizinisch gemeint sind.\n\nDort lebt eine nette, etwas dicke, einfache Frau, die ihn gepflegt hat. Sie ist warmherzig, arglos und nicht besonders schnell im Denken, aber auf eine entwaffnende Weise freundlich.\n\nSie erklaert Taron, ein fremder Mann habe ihr versprochen, sie bekomme ein Goldstueck, wenn sie ihn pflegt, bis er wieder aufwacht.\n\n### Der Hinweis auf den Erzaehler\n\nAls sie den Fremden beschreibt, erinnert die Beschreibung Taron unangenehm stark an den Erzaehler:\n\n- kuehle Stimme\n- sehr genaue Wortwahl\n- etwas zu viel Spott in den Pausen\n- wirkte, als wisse er bereits, wie das Gespraech endet\n- sagte vielleicht etwas wie: \"Er wird sterben wollen, wenn er aufwacht. Lassen Sie ihn nicht.\"\n\nTaron glaubt sofort, dass das unmoeglich ist. Der Erzaehler ist nur eine Stimme. Eine eingebildete, arrogante, unerwuenschte Stimme. Stimmen laufen nicht durch die Welt und verteilen Goldstuecke an freundliche Frauen.\n\nDer Erzaehler kommentiert daraufhin, dass dies eine bemerkenswert enge Definition von Stimmen sei.\n\n### Funktion der Szene\n\n- Der Leser bekommt den ersten echten Hinweis, dass der Erzaehler mehr ist als ein Kommentar.\n- Taron bekommt einen Grund, an seinem eigenen Verstaendnis der Stimme zu zweifeln.\n- Die Rettung wirkt nicht wie Zufall, sondern wie ein Eingriff.\n- Der Erzaehler kann weiterhin behaupten, er habe nichts damit zu tun.\n\n---\n\n## Offene Fragen\n\n- Hat der Erzaehler Taron direkt aus dem Dungeon geholt oder jemanden damit beauftragt?\n- Ist die Frau zufaellig ausgewaehlt oder gibt es einen Grund, warum sie Taron aufnehmen konnte?\n- Hat das Monster Taron wirklich beinahe getoetet oder hat es ihn erkannt?\n- Wissen die Priester, dass Taron ueberlebt hat?\n- Wird sein Ueberleben als noch groesserer Beweis seiner Auserwaehltheit gedeutet?\n\n---\n\n## Kapitel 2: Rueckkehr nach Waldkirch\n\nTaron kehrt verletzt nach Burg Waldkirch zurueck. Fuer ihn fuehlt sich der Dungeon wie ein seltsamer Traum an, aber seine Schmerzen beweisen, dass etwas Wirkliches passiert ist. Weil er das Monster nicht getoetet hat, sondern nur irgendwie entkommen ist, glaubt er, damit sei endlich bewiesen, dass er nicht der Auserwaehlte ist.\n\nStattdessen geht er in den Stall und versucht, zu seiner normalen Arbeit zurueckzukehren. Der Burgvogt entdeckt ihn beim Ausmisten und ist so erschrocken, dass ihm eine altertuemliche Fluchformel entfaehrt. Fuer die Burg ist Tarons Ueberleben kein Gegenbeweis, sondern der groesste Beweis ueberhaupt.\n\nTaron wird zum Koenig gebracht. Koenig Albrecht ist gluecklich, endlich eine Hoffnung fuer das angeschlagene Reich zu haben, und hoert Tarons Einwaende nicht wirklich. Das Reich steht schlecht da, unter anderem weil viele der besten Ritter in frueheren \"Pruefungen\" an das Monster verloren wurden.\n\nDer Koenig laesst Taron mit dem Besten ausstatten, was noch uebrig ist. Das klingt feierlich, ist aber halb enttaeuschend: geflickte Ruestung, ein alter Waffenrock, unpassende Ausruestung und ein Pferd, das mehr Erfahrung als Glanz besitzt.\n\nBruder Malchior erklaert Tarons angebliche Aufgabe: Er soll nach Westen zum Turm von Abendriss reiten und dort den Menschenschluessel bergen, einen der drei alten Eidschluessel. Taron gibt auf, weil niemand ihm zuhoert. Er reitet los, haelt sich nur so lange heldenhaft aufrecht, bis die Burg ihn nicht mehr sehen kann, macht dann Pause und isst den Proviant.\n\nDas Kapitel endet mit einem Hornsignal aus Richtung Burg Waldkirch, das andeutet, dass die naechste Katastrophe bereits begonnen hat.\n\n---\n\n## Kapitel 3: Zehn Jahre frueher\n\nDas Hornsignal wirft Taron in eine Erinnerung an zehn Jahre zuvor zurueck. Damals war er sieben Jahre alt, kannte seine Eltern nicht und lebte auf Burg Waldkirch in einem warmen, unscharfen Gefuehl von Zugehoerigkeit. Wenn er an diese Zeit denkt, fuehlt es sich an, als habe er eine Familie gehabt, auch wenn er niemanden klar benennen kann.\n\nZu dieser Zeit konnte Taron den Erzaehler noch hoeren. Die Stimme war fuer ihn normal, fast vertraut, und begleitete ihn durch die Kindheit. Kurz nach der damaligen Katastrophe verschwand sie.\n\nDie Katastrophe war der Einmarsch der Zwergenheere aus dem Westen. Die Geschichte nennt sie boese Zwerge; sie sind in dieser Welt eine reale Macht aus Stein, Eisen und alter Wut, nicht nur ein Kinderschreck.\n\nBurg Waldkirch und Lichtenhain konnten sich damals verteidigen, weil das Reich noch gut gefuehrt war und ueber erfahrene Ritter verfuegte. Die spaeter besungene epische Schlacht war in Wahrheit auch von Glueck, Panik, Zufall und schlechter Sicht gepraegt, aber nicht laecherlich: Damals traf Vorbereitung auf ihre Grenze. Am Ende der Schlacht erklingt das Kriegshorn der Zwerge, woraufhin sie sich zurueckziehen. Die Menschen deuten das als Flucht und Sieg.\n\nSpaeter soll sich herausstellen, dass der Rueckzug kein Zeichen von Niederlage war: Die Zwerge hatten im ueberfallenen Land ihren eigenen Zwergenschluessel wiedergefunden und mussten Waldkirch deshalb nicht weiter angreifen. Darum blieb es zehn Jahre lang vergleichsweise ruhig. Zwei Nachbarlaender, Graumark und Ellingen, wurden dennoch von den Zwergen unterjocht, und die Bedrohung blieb bestehen.\n\nNach der Schlacht wurde die alte Prophezeiung wieder wichtig: Einer solle kommen, der das Koenigreich durch die duestere Zeit leitet. Dass die Prophezeiung viel aelter ist als der Zwergenkrieg, stoert niemanden, weil verängstigte Reiche alte Worte gern passend machen.\n\nDas Kapitel endet in der Vergangenheit mit dem Verschwinden der Stimme. Die Rueckkehr in die Gegenwart und Tarons Entscheidung, auf das aktuelle Hornsignal zu reagieren, gehoeren in Kapitel 4.\n\n---\n\n## Kapitel 4: Der Plan\n\nTaron kehrt aus der Erinnerung in die Gegenwart zurueck. Das Gefuehl aus der Vergangenheit, besonders die Erinnerung an die Stimme als Freund und an Waldkirch als sicheren Ort, ueberzeugt ihn, der Aufgabe zumindest eine Chance zu geben.\n\nEr spielt den Auftrag im Kopf durch und macht ihn sich laecherlich einfach: hinreiten, Turm finden, Schluessel nehmen, rausgehen. Vielleicht gibt es ein kleines Hindernis, aber sicher nichts Grosses. Dabei stellt er sich vor, dass Kinder spaeter einmal so warm auf diese Zeit zurueckblicken koennten wie er auf die Zeit vor den Zwergen.\n\nDieser Gedanke fuehrt ihn zu Elva. Er gesteht sich selbst ein, dass er sie liebt, will aber sofort nicht weiter daran denken.\n\nElva bleibt zunaechst in Waldkirch und wird dort zur zweiten Perspektive auf die Burg. In der Kueche und auf den Dienstwegen bekommt sie mit, wie Koenig Albrecht und Malchior ueber Taron sprechen, sobald er nicht mehr im Raum ist. Sie sagen nicht grausam, sondern geradezu vernuenftig, dass ein wenig Leiden des Auserwaehlten tragbar sei, wenn dadurch das ganze Land Freiheit gewinne. Weil Elva weiss, dass Taron nie wirklich gefragt wurde, macht sie sich spaeter auf die Suche nach ihm.\n\nAuf dem Ritt fragt Taron den Erzaehler, warum er ihn damals verlassen hat und wo er war. Die Antwort ist kurz und trauriger als sonst. Taron merkt, dass die letzten zehn Jahre auch fuer die Stimme schmerzhaft waren, und fragt nicht weiter.\n\nDer Weg zum Turm von Abendriss dauert etwa zwei Tagesritte. Am ersten Abend erreicht Taron die Freie Burg Hohensteg und das Gasthaus Zum Blauen Eber. Er versucht, als Auserwaehlter kostenlos ein Zimmer zu bekommen, scheitert aber an einem sehr praktischen Wirt.\n\nAn der Bar trifft Taron Sir Oswin von Hohenklamm: stark, gutaussehend, ein echter Ritter, aber fast immer betrunken. Im Rausch sagt Oswin zu, Taron zu begleiten. Am Morgen behauptet Taron, Oswin habe im Suff zugesagt. Oswin reagiert nur mit: \"Nicht schon wieder\", begleitet ihn aber.\n\n---\n\n## Kapitel 5: Ein Ritter und ein Vorschlag\n\nOswin wird genauer vorgestellt: Er ist ein Weiberheld-Typ, gutaussehend, stark und im Kern ein echter Ritter, aber vom Alkohol und den Zwergenkriegen gezeichnet. Er hat keine Stimme im Kopf und findet Tarons Gespraeche mit \"Niemandem\" zwar seltsam, aber nicht seltsamer als vieles andere.\n\nAuf der Strasse zeigt Oswin, dass er wirklich gut im Rittern ist: Er liest Spuren, erkennt Gefahr und erledigt Wegelagerer schnell und kontrolliert, ohne sie zu toeten. Danach erfahren wir, dass er in den Zwergenkriegen gekaempft hat und mitzählt, wie viele Boese er getoetet hat. Es sind viele. Eine kurze Rueckblende zeigt seinen ersten getoeteten Zwerg und den Moment, in dem Oswin begriff, dass niemand ihm die Last abnehmen wuerde. Er zaehlt als Suehne, nicht aus Stolz, weil er nicht vergessen will, dass es einzelne waren.\n\nOswin schlaegt vor, einen Zauberer zu suchen. Seiner Meinung nach kann man Zauberer immer brauchen, selbst wenn sie nur Bohnen warm oder Bier kalt zaubern koennen. Taron hat keine Lust, aber der Erzaehler haelt es fuer eine gute Idee und macht \"la la la\"-Geraeusche, bis Taron nachgibt.\n\nTaron behauptet, in einem komischen Kaff wie Hohensteg werde man sowieso keinen Magier finden. Der Wirt vom Blauen Eber antwortet ganz selbstverstaendlich, dass es natuerlich einen Zauberer im Dorf gibt: Merlan Graufinger. Er sagt das, als sei er die ganze Zeit Teil des Gespraechs gewesen. War er nicht.\n\n## Folge fuer Kapitel 6 und 7: Der falsche Zauberer\n\nTaron und Oswin suchen Merlan in der Erwartung, einen Zauberer zu finden, der Feuer, Licht oder wenigstens warme Bohnen beisteuert. Stattdessen finden sie einen Prophezeiungsgelehrten, der an Weissagungen glaubt, aber ihre Auslegung sehr viel ernster nimmt als die Priester von Waldkirch.\n\nMerlan erklaert ausserdem, dass fast alles, was heute \"Magie\" genannt wird, in Wahrheit Stoffkunde ist: Kraeuter, Salze, Metalle, Rauch, Hitze und Reaktionen, die Leute erschrecken, weil sie sie nicht verstehen. Manche Mittel sind trotzdem so selten und schwer herzustellen, dass sie auf dem Dorf wie Wunder wirken. Das macht echte Magie fuer ihn nicht unwahrscheinlicher, sondern seltener und ernster. Er spricht beiläufig von alten Wesen, Eidtraegern und Schutzmaechten, als gehoerten sie zu einer verantwortungsvoll gelesenen Theologie, ohne direkt auf den Erzaehler zu zeigen.\n\nMerlan liest die Prophezeiung sachlich neu. Er erklaert, dass sie nicht beweist, dass Taron ein grosser Held oder Kaempfer ist, sondern dass Taron eine alte Bedingung erfuellt: Er ist jemand ohne Machtlinie, ohne Orden, ohne Anspruch und damit vielleicht genau die falsche Person, die eine gebrochene Ordnung nicht sofort wieder im Sinne einer Seite benutzt. Dabei erkennt Merlan auch, dass der Auftrag nicht mit einem einzelnen Schluessel erledigt ist. Die Prophezeiung spricht von drei Eidschluesseln: dem Menschenschluessel, dem Zwergenschluessel und dem Schutzschluessel. Der bekannte Satz \"Die Schluessel bringen Freiheit\" ist fuer ihn keine Loesung, sondern ein Warnzeichen, weil ein alter Weinfleck genau das Wort verdeckt, das sagen muesste, wem diese Freiheit gebracht wird.\n\nTaron wird darueber wuetend, weil sein ganzer innerer Plan aus Kapitel 4 auf \"hinreiten, Schluessel nehmen, rausgehen\" beruhte und sich nun als bemerkenswert kurze Fantasie erweist. Der Erzaehler erinnert ihn sehr hilfsbereit daran, dass Tarons Plan doch so wunderbar einfach gewesen sei, und fragt, ob Taron die anderen beiden Schluessel vielleicht aus Hoeflichkeit ignorieren wollte. Merlan hilft ihnen mit Deutung, Warnungen und einer Richtung, kommt aber nicht mit.\n\nZum Abschied gibt Merlan Taron eine kleine Rauchbombe. Er nennt sie keine Magie, weil sie keine ist: nur eine unangenehm wirksame Mischung aus Stoffkunde, trockenem Pulver, schlechtem Geruch und der Erfahrung, dass Menschen mit traenenden Augen selten ordentlich zielen. Selten ist sie trotzdem, weil kaum jemand die Zutaten sauber mischen kann, ohne sich die Finger, das Dach oder die naehere Zukunft zu verderben. Wenn man sie zerbricht, fuellt sie fuer kurze Zeit einen Raum oder eine Gasse mit dichtem, beissendem Rauch. Sie funktioniert nur einmal und ist zum Weglaufen gedacht, nicht zum Siegen.\n\nOswin erkennt sofort, was Merlan ihnen da gibt. Er hat solche Rauchmittel in den Zwergenkriegen gesehen, selten und meist in Haenden von Leuten, die vorher bezahlt wurden und nachher nicht mehr auffindbar waren. Seiner Meinung nach haben solche Dinger mehr als einmal ueber Sieg oder Niederlage entschieden. Taron hebt sie danach trotzdem immer wieder auf, weil der naechste Moment vielleicht noch schlimmer werden koennte. Oswin wird darueber zunehmend wuetend, vor allem in Kaempfen, in denen etwas dichter Rauch sehr angenehm gewesen waere. Am Ende denkt kaum noch jemand an die Rauchbombe; gerade dann rettet sie ihnen den Arsch, weil niemand im entscheidenden Augenblick sieht, wohin Taron laeuft.\n\n## Neue Hauptachse: Das Eidenschloss und die drei Schluessel\n\nDie drei Eidschluessel sind nicht einfach Artefakte, die Macht sammeln oder den Frieden wiederherstellen. Sie gehoeren zum Eidenschloss, einem alten Gefaengnis, in dem ein boeser Schutzdaemon eingeschlossen wurde. Wer die Schluessel zusammenbringt, bringt nicht nur die Loesung naeher, sondern auch den Gefangenen. Deshalb ist die verfleckte Prophezeiung technisch wahr: Die Schluessel bringen Freiheit. Nur moeglicherweise nicht den Menschen, Zwergen oder sonst jemandem, der gern am Ende eines Liedes jubeln moechte.\n\nDer Zwergenkoenig hoert ebenfalls eine Stimme. Fuer die Zwerge ist das ein heiliges Zeichen, aehnlich wie Tarons Erzaehler fuer die Menschen irgendwann als Zeichen gedeutet wird. Der Unterschied: Die Stimme im Zwergenkoenig schuetzt nicht. Sie lenkt, verhaertet, verdreht und macht aus alter Wut eine scheinbar klare Wahrheit.\n\nAls Taron den Menschenschluessel findet, bemerkt unser Erzaehler dessen Ausstrahlung. Er wird fuer einen Moment ungewoehnlich still und erkennt, dass der Schluessel nicht nur zu einem Eid, sondern auch zu einem Gefaengnis gehoert. In diesem Schloss steckt etwas, das seiner eigenen Art aehnelt, aber verdorben ist. Er sagt Taron nicht alles, weil er selbst noch nicht weiss, ob er sich irrt, und weil ihn ein alter Eid daran hindert, bestimmte Wahrheiten einfach auszusprechen. Taron muss manche Dinge selbst erkennen, sonst waeren sie nur Befehle einer weiteren Stimme. Wenn der Erzaehler gegen diese Regel verstoesst, muss er seinen Wirt verlassen, also Taron.\n\nDamit wird auch klarer, was die Zwerge vor zehn Jahren unter Waldkirch gesucht haben: Sie suchten nicht Gold oder Land, sondern Spuren des Eidenschlosses und vor allem ihren eigenen Zwergenschluessel, der im ueberfallenen Land verborgen lag. Als sie ihn wiederhatten, war der Angriff aus ihrer Sicht erfolgreich. Der boese Erzaehler im Zwergenkoenig hat ihre Suche gelenkt und sie glauben lassen, sie muessten die drei Eidschluessel sichern, um ihr Volk zu retten. In Wahrheit bereiten sie seine Befreiung vor.\n\nBrokk Eisenhand wird dabei zum entscheidenden neuen Gefaehrten. Taron und Oswin treffen ihn bei der Suche nach dem Schutzschluessel, den beide Seiten brauchen. Brokk nimmt sie zunaechst gefangen, laesst sie aber entkommen und begleitet sie, weil er den alten Zwergenkoenig zurueckhaben will. Brokk war dem Koenig frueher nah und hat miterlebt, wie er sich veraenderte, haerter wurde und schliesslich mit \"Niemandem\" sprach. Eine kurze Rueckblende zeigt, dass Brokk den Koenig nicht nur aus alten Liedern idealisiert: Er hat wirklich mit ihm fuer das Gute gekaempft, Seite an Seite, bevor die Stimme kam. In Taron sieht Brokk keine einfache Rettung, sondern eine gefaehrliche Hoffnung: Wenn es eine Stimme gibt, die nicht kontrolliert, kann vielleicht auch sein Koenig wieder frei werden.\n\nBrokk macht klar, dass mit dem Koenig auch das Zwergenreich selbst veraendert wurde. Frueher wurde in den Hallen gesungen, gegessen, gestritten und gefeiert; selbst ein harter Koenig wusste, wann ein Volk trinken, trauern oder lachen musste. Seit die Stimme kam, wurden Lieder zu Laerm, Feste zu Verschwendung und Zweifel zu Ungehorsam. Fuer Brokk geht es deshalb nicht nur um Politik, sondern um die Rueckkehr eines ganzen verlorenen Lebens.\n\nZwischen Oswin und Brokk ist am Anfang fast alles Spannung. Oswin zaehlt die Zwerge, die er getoetet hat; Brokk zaehlt die Menschen. Als sie feststellen, dass ihre Zahlen aehnlich hoch sind, ist das kein Moment der Versoehnung, sondern ein sehr stiller Grund, die Hand naeher an der Waffe zu lassen. Erst spaeter merken sie, dass ihre Zahlen aus verwandtem Schmerz kommen: bei Oswin als Suehne, bei Brokk als Weigerung, aus Feinden nur noch Masse zu machen.\n\nIm Kampf ergaenzen sie sich besser, als beide zugeben wollen. Oswin liest offene Bewegung, Geschwindigkeit und Luecken; Brokk liest Stand, Druck und Linien. Zusammen werden sie gefaehrlich, weil sie genau die Art Krieg kennen, die der andere ueberlebt hat.\n\nIm Finale veraendert sich ihre Zaehlweise. Sie toeten weiterhin, wenn sie muessen, aber sie zaehlen nicht mehr nur die Gegner, die fallen. Wenn Brokk einen Menschen niederstreckt, der gerade einen Zwerg erschlagen wuerde, zaehlt Oswin den geretteten Zwerg. Wenn Oswin einen Zwerg aufhaelt, der einen jungen Soldaten zerhacken wuerde, zaehlt Brokk den geretteten Menschen. Ihre alten Zahlen verschwinden nicht, aber daneben beginnt eine neue Liste.\n\nWenn die drei Eidschluessel spaeter am Eidenschloss zusammengebracht werden, merken Taron und die anderen zu spaet, was sie angerichtet haben. Der Daemon wird frei, der Zwergenkoenig bricht zusammen, und die Zwerge glauben, die Menschen haetten ihren Koenig getoetet. Dadurch beginnt der eigentliche Kampf erst recht.\n\nElva findet Taron auf dem Rueckweg nach Waldkirch und bringt ihm keine romantische Geste, sondern eine Warnung: In der Burg ist er fuer viele bereits weniger Mensch als Zeichen, Werkzeug und moegliches Opfer. Das macht sie organischer fuer die Handlung, weil sie nicht einfach mitreist, sondern aus Waldkirch genau die Information bringt, die Taron am meisten trifft.\n\nIn diesem Chaos kommt endlich Merlans Rauchbombe zum Einsatz. Taron benutzt sie nicht als heldische Waffe, sondern genau so, wie sie gedacht war: um nicht sofort getoetet zu werden. Im dichten Rauch entkommt er lange genug, damit der Kampf nicht in den ersten Minuten alles entscheidet.\n\nAls der Zwergenkoenig wieder erwacht, ist die fremde Stimme fort. Er begreift, wie sehr er in den letzten Jahren fehlgeleitet wurde, und befiehlt seinen Leuten, die Waffen fallen zu lassen. Der Befehl beendet nicht alle Feindschaft, aber er beendet die Schlacht. Das erste Buch endet danach ruhiger: Die wichtigsten Figuren sitzen noch einmal zusammen und versuchen zu verstehen, was wirklich passiert ist, waehrend der befreite Daemon bereits in die Welt verschwunden ist.\n\nTaron ist danach wuetend auf den Erzaehler, weil er nicht klar gesagt hat, dass die Schluessel ein Gefaengnis oeffnen koennen. Der Erzaehler versucht erst, mit einem trockenen Spruch auszuweichen, sagt dann aber die Wahrheit: Haette er es ausgesprochen, haette er seinen Eid gebrochen und Taron verlassen muessen. Das macht Tarons Wut nicht sofort kleiner, aber sie bekommt eine andere Form.\n\n## Spaetere Schluesselszene: Der Preis des Schutzes\n\nIn der Kammer des Eidsteins geraet Taron spaeter in eine Lage, aus der es keinen normalen Ausweg mehr gibt. Der andere Schutzdaemon hat ihn fast, die Gefaehrten koennen nicht mehr helfen, und die feindlichen Wesen im Raum ruecken so sicher naeher, als haette die Geschichte bereits entschieden, wer hier stirbt.\n\nZum ersten Mal uebernimmt der Erzaehler offen. Der Effekt soll hart, gross und erschreckend sein: kein netter Lichtzauber, sondern ein kalter Schutzbefehl, dem der Raum selbst gehorcht. Fuer einen Augenblick wird alles still, Tarons Stimme spricht nicht wie Taron, und alle Feinde im Raum sterben gleichzeitig.\n\nDanach ist Taron nicht erleichtert, sondern sauer. Wenn der Erzaehler so etwas kann, warum hat er es nicht frueher getan? Warum nicht im Dungeon, warum nicht bei den anderen beinahe verlorenen Kaempfen? Der Erzaehler versucht, lustig zu bleiben, doch seine Stimme bricht, wird duenn und kurz wieder so verletzlich wie frueher. Dadurch wird klar: Er kann Taron retten, aber nicht beliebig oft, und jeder direkte Eingriff kostet ihn einen Teil seiner Kraft.\n"
