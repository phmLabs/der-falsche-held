- slug: 02-der-hunger-verschlang-taron-beinahe
  title: Der Hunger verschlang Taron beinahe
  description: Als Prüfung wurde Taron dem übermächtigen Hunger von Waldkirch vorgeworfen und überlebte nur, weil der Erzähler im letzten Moment eingriff; er erwachte bei Marta, die von einem Fremden bezahlt worden war. Die Stimme aus Kindertagen blieb spöttisch-distanziert, doch ihre Bindung zeigte sich als lebensrettend. Taron beschloss trotzig, einfach zur Stallarbeit zurückzukehren.
  status: draft
  goals:
