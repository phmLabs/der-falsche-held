- slug: 01-die-hofleute-erklaerten-taron-zum-auserwaehlten
  title: Die Hofleute erklärten Taron zum Auserwählten
  description: Auf Burg Waldkirch wurde Taron wegen einer lächerlich passenden Auslegung der Prophezeiung zum Auserwählten erklärt, obwohl er nur Stallbursche ohne bekannte Eltern war. Rückblenden zeigten den letzten Hornruf beim Zwergenangriff und dass die Zwerge damals heimlich ihren Schlüssel zurückgewannen. Ein alter Weinfleck auf der Prophezeiung ließ offen, wem die versprochene Freiheit galt.
  status: draft
  goals:
