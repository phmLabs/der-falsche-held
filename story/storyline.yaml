- slug: 10-der-erzaehler-sprach-das-toedliche-urteil
  title: Der Erzähler sprach das tödliche Urteil
  description: Als alles verloren schien, übernahm der Erzähler Taron und entfaltete einen gewaltigen Schutzzauber, der alle feindlichen Wesen zu Boden streckte; der Preis schwächte ihn fast tödlich. Im Chaos setzte Taron endlich Merlans Rauchbombe ein, Oswin und Brokk verteidigten gemeinsam und begannen, Rettungen statt Leichen zu zählen. Der Zwergenkönig erwachte, ließ die Waffen fallen und ein brüchiger Frieden schloss das Kapitel, während der entfesselte Dämon für Band zwei wartete.
  status: draft
