- slug: 08-der-wahre-zweck-der-schluessel-trat-zutage
  title: Der wahre Zweck der Schlüssel trat zutage
  description: Nach und nach setzten sie zusammen, dass die drei Eidschlüssel das Eidenschloss bilden, ein uraltes Gefängnis für einen bösen Schutzdämon, der den Zwergenkönig und Menschenintrigen gelenkt hatte. Sie fassten den Plan, alle Parteien zum Eidenschloss unter Waldkirch zu lenken, obwohl dies die Gefahr einer ungewollten Befreiung erhöhte.
