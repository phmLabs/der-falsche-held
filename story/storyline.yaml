- slug: 07-brokk-nahm-taron-und-oswin-gefangen
  title: Brokk nahm Taron und Oswin gefangen
  description: Auf der Suche nach dem Schutzschlüssel stellte sie Brokk Eisenhand und nahm sie gefangen, erkannte jedoch Tarons Gespräch mit „Niemand“, wie es sein König tat. Er schilderte das erkaltete Zwergenreich unter der fremden Stimme und wechselte, misstrauisch, aber entschlossen, die Seiten. Oswin und Brokk stießen an ihre Kriegsnähte und begannen, die Namen der Toten gegeneinander zu zählen.
  status: draft
  goals:
