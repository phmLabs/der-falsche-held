- slug: 05-merlan-enthuellte-die-drei-schluessel
  title: Merlan enthüllte die drei Schlüssel
  description: Merlan, gelehrt in Prophezeiungen und Stoffkunde, erklärte Magie als seltene Gefahr und heutige „Zauber“ als Chemie aus Rauch, Salzen und Metallen. Er erkannte, dass Taron nicht einen, sondern drei Schlüssel brauche, und gab ihm eine seltene Rauchbombe. Tarons simpler Plan zerbrach, Oswin nickte die Kriegsnützlichkeit solcher Mittel ab.
