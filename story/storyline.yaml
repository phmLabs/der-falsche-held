- slug: 03-koenig-albrecht-schickte-taron-zum-abendriss
  title: König Albrecht schickte Taron zum Abendriss
  description: König Albrecht deutete Tarons Überleben als göttliches Zeichen, überging seine Einwände, steckte ihn in das „Beste, was übrig ist“ und befahl die Bergung des Menschenschlüssels aus dem Turm von Abendriss. Der offizielle Hofmythos stellte Taron als Retter des Reiches aus, doch Zweifel blieben.
  status: draft
