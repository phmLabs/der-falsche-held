  description: 'Im Turm überwand Taron Fallen und Wächter mehr mit Klugheit als mit Heldentum und erlangte den Menschenschlüssel. Der Erzähler verstummte unheimlich, als er die Aura eines Gefängnisses spürte – nicht leer, sondern wie ein lebendiges Etwas, das im Eidenschloss gebunden war. Der Fund löste alte Mechanismen aus und zwang die Gefährten zur Flucht, mit der Ahnung: Waldkirch wird von einem Wächter beschützt, der nur auf das Zeichen der Schlüssel hört.'
