  title: Merlan las die Weissagung neu und gab die Rauchbombe
  description: 'Der Prophezeiungsgelehrte Merlan entzauberte Alltagsmagie, las die Weissagung streng und machte die drei Eidschlüssel sowie das zweifelhafte Versprechen der „Freiheit“ deutlich. Zudem deutete er an, dass die Schlüssel nicht nur Schlösser öffnen, sondern den gebundenen Wächter von Waldkirch im Eidenschloss besänftigen: Ohne ihr Zeichen greife das Wesen jeden Eindringling an. Er gab Taron eine seltene Rauchbombe und schickte ihn mit nüchternen Warnungen weiter.'
