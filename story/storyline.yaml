    Auf Burg Waldkirch hielten Priester und Ritter Taron aufgrund einer missverstandenen Prophezeiung für den Auserwählten und forderten den Beweis: die heilige Prüfung im alten Dungeon. Der Erzähler kehrte mit kühler, spöttischer Stimme zurück, während Taron erkannte, dass ihm niemand zuhören würde.

    Der uralte Hunger von Waldkirch jagte Taron durch die zu engen Gänge; Taron rannte, stolperte und überlebte nur durch List und Zufall. Im letzten Moment wurde er fortgerissen, als würde er sterben, während der Erzähler verdeckt half.
  status: final
