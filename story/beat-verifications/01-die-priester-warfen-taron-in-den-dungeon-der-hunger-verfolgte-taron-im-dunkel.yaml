beat_slug: 01-die-priester-warfen-taron-in-den-dungeon-der-hunger-verfolgte-taron-im-dunkel
created_at: 2026-08-23T07:27:10.352Z
overall: covered
summary: Das Kapitel liefert die missdeutete Auserwählung mit erzwungener Dungeon-Prüfung, Tarons gehetztes Überleben samt verdecktem Eingreifen des Erzählers und etabliert zugleich sein widerwilliges Antiheldenprofil.
chapters:
- slug: 01-die-prophezeiung
  verdict: covered
  evidence: Die Priester erklären Taron nach dem Milcheimer anhand einer Prophezeiung zum Auserwählten; der König ordnet als Beweis die Prüfung im Gewölbe an, und Ritter stoßen Taron hinab. Unten flieht er vor dem „Hunger von Waldkirch“, folgt teils der zurückgekehrten, spöttischen Erzählerstimme, verletzt das Monster mit blauer Flamme, wird schwer getroffen und im letzten Moment „weggezogen“. Er erwacht bei der Heilerin, wohin ihn ein unheimlicher Mann brachte (impliziertes Eingreifen des Erzählers), und bricht mit Mantel und Proviant auf – als zögerlicher, listiger Läufer statt strahlender Held.
