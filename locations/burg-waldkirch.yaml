name: Burg Waldkirch
slug: burg-waldkirch
type: Gebaeude
description: >-
  Eine kantige Höhenburg auf einem bewaldeten Rücken, deren Mauern Flechten und altes Moos tragen. Innen mischen sich
  Ziegenställe, Küche und Kapelle, darüber ein windschiefer Bergfried. Unter dem Hof ducken sich Gänge und Kammern aus
  älterer Zeit: das Dungeon, in das kaum noch jemand hinab will.
atmosphere: >-
  Harzer Duft von Kiefern, das blecherne Läuten einer kleinen Glocke und das meckernde Echo der Ziegen prägen die Tage.
  In den Fluren zieht kalter Zugwind, der den Ruß von den Wänden leckt. Aus der Tiefe steigt feuchte Erde, Eisen und ein
  Hungergeruch, den niemand so recht benennen kann. Nachts klirren Ketten, die keiner mehr besitzt.
significance: >-
  Hier beginnt Tarons unfreiwillige Reise: ein Eimer Ziegenmilch, ein Name, ein Ruf – und Bruder Malchiors Deutung
  entfachen den Mythos. Die Burg ist Bühne der ersten Prüfung, Tor zum uralten Hunger von Waldkirch und Machtbasis der
  Frommen, die ihre Zeichen sehen wollen. Ihre klaustrophobischen Gänge zwingen Taron zu Flucht, Einfallsreichtum und
  erstem Lauschen auf die Stimme, die ihn lenkt.
