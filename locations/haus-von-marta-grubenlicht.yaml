name: Haus von Marta Grubenlicht
slug: haus-von-marta-grubenlicht
type: Gebaeude
description: >-
  Ein niedriges Fachwerkhäuschen am Rand des Dorfes, dicht an den Wegrand geschmiegt, mit einem Anbau für Holz, Kräuter
  und Wasserfässer. Innen teilen Herd, Bettstatt und Arbeitstisch den einen Raum, darüber ein schmaler Schlafboden. Im
  Fenster trocknen Bündel aus Kamillen- und Beifußstängeln.
atmosphere: >-
  Warmes Lampenlicht schimmert über kupfernes Kochgeschirr, und Dampf von Brühe und Kräutertee süßt die Luft. Draußen
  wispert der Wind im Gras; drinnen knackt das Holz und der Löffel klirrt leise am Tontopf. Der Geruch von Seife,
  getrockneter Wolle und Harz legt sich wie eine Decke über Müdigkeit und Schmerz.
significance: >-
  Hier erwacht Taron nach seiner rätselhaften Rettung, versorgt von Händen, die mehr wissen als sie sagen. Marta
  berichtet vom Fremden mit dem Goldstück und wird so zur Botin eines größeren Plans. Das Haus ist Zuflucht,
  Genesungsort und der Platz, an dem Taron erstmals ahnt, dass die Stimme in seinem Kopf womöglich mehr ist als nur sein
  eigenes Echo.
