name: Elva
slug: elva
role: Verbündete
traits: >-
  Frechzüngig, flink und mit dem trockenen Humor einer, die früh aufsteht und spät schlafen geht. Sie spricht direkt,
  manchmal zu laut, und lacht, wenn andere den Kopf schütteln. Unter der rauen Schale hat sie ein empfindliches Gespür
  für Ungerechtigkeit und ein schlechtes Gewissen, wenn jemand ihretwegen leidet. Sie ist praktisch veranlagt und
  verabscheut großen Zauber in kleinen Küchen.
backstory: >-
  Elva ist die Tochter eines Ziegenhirten und seit ihrer Kindheit zwischen Stall, Hof und Küche der Burg Waldkirch
  unterwegs. Sie melkt, trägt, wischt und kennt jeden knarrenden Stufenabsatz im Bergfried. Prophezeiungen hielt sie
  stets für Gerede der Herren, bis ein schief gehaltener Eimer Ziegenmilch Taron zum Auserwählten machte. Seitdem hadert
  sie mit der Rolle des Auslösers und fühlt sich merkwürdig verpflichtet, das angerichtete Chaos irgendwie zu begrenzen.
