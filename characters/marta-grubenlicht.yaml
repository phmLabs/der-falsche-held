name: Marta Grubenlicht
slug: marta-grubenlicht
role: Verbündete
traits: >-
  Kräftige Hände, leise Schritte und ein Blick, der Fieber lügt nicht von der Stirn lesen kann. Sie spricht in kurzen,
  bodenständigen Sätzen und würzt sie mit Sprichwörtern, die nach Erde schmecken. Misstrauisch gegenüber Obrigkeit, doch
  weich, wenn jemand Hilfe braucht. Ihre Fürsorge ist sachlich, nicht süß – und gerade darum tröstlich.
backstory: >-
  Als Witwe eines Grubenarbeiters lernte Marta, mit wenig viel zu bewirken; ihr Name blieb, der Stollen ging. Die
  Kräuterlehre erbte sie von der Großmutter und tauschte seit Jahren Salben gegen Eier, Geschichten gegen Brot. Ein
  fremder Mann mit stillen Augen legte ihr ein Goldstück auf den Tisch und bat um Pflege für Taron – mehr Grund brauchte
  sie nicht. Sie hilft nicht aus Glauben an Prophezeiungen, sondern aus Pflichtgefühl und einer stillen Wut gegen
  sinnloses Leid.
