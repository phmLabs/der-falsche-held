name: Bruder Malchior
slug: bruder-malchior
role: Antagonist
traits: >-
  Hager, asketisch, mit Augen, die wie brennende Kerzen Dochte suchen. Er spricht gemessen, zitiert Schriften mit der
  Gewissheit eines Mannes, der nie danebenliegt, und riecht nach Tinte und kaltem Weihrauch. Freundliche Gesten kommen
  ihm leicht, doch sein Eifer frisst Widerspruch wie trockenes Holz. Er hält Zweifel für ein Werkzeug Gottes – solange
  es nicht gegen seine Deutung gerichtet ist.
backstory: >-
  Malchior wuchs als Findelkind in einem abgelegenen Kloster auf und fand Halt in Regeln, Riten und Randnotizen. Ein
  zerfledderter Codex über die Zeichen des Auserwählten wurde zu seiner heimlichen Bibel. Als Schreiber und Beichtvater
  auf Burg Waldkirch sah er in Tarons Namen, Milch und Widerspruch die Erfüllung lang erwarteter Verse. Aus aufrichtiger
  Überzeugung – und einer Sehnsucht, recht zu behalten – ließ er die Prüfung im alten Dungeon anordnen.
