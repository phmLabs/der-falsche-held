name: Brokk Eisenhand
role: ''
traits: >-
  Brokk ist ein erfahrener Zwergenhauptmann, alt genug, um bessere Zeiten erlebt zu haben, aber noch nicht alt genug, um
  sich damit abzufinden, dass sie vorbei sind. Er ist breit, ruhig, schwer zu beeindrucken und trägt seine Müdigkeit
  nicht wie Schwäche, sondern wie Ausrüstung. Im Kampf ist er gefährlich, aber nicht wild. Er verschwendet keine
  Bewegung, kein Wort und möglichst auch keinen Gegner.

  Früher war Brokk ein enger Waffenbruder des Zwergenkönigs. Er hat ihn bewundert, vielleicht sogar geliebt auf diese
  harte, unausgesprochene Art, mit der Soldaten Männer lieben, denen sie ihr Leben anvertrauen. Für Brokk war der König
  nie nur Herrscher, sondern der Mann, der mit ihnen aß, sang, lachte und im Dreck stand, wenn es nötig war. Genau
  deshalb trifft ihn die Veränderung des Königs so tief.

  Brokk merkt seit Jahren, dass etwas nicht stimmt. Der König ist nicht einfach strenger geworden. Er ist kälter
  geworden. Er hört schlechter zu, spricht manchmal zu leerer Luft, bricht alte Bräuche ab und nennt es Notwendigkeit.
  Brokk hat das lange entschuldigt: Krieg, Verlust, Verantwortung. Aber je länger es dauert, desto weniger glaubt er
  sich selbst.

  Er ist kein Rebell. Noch nicht. Brokk ist loyal bis an die Grenze der Selbstverletzung. Er glaubt an Eid, Volk, Halle
  und Ordnung. Aber sein Gewissen ist älter als seine Befehle, und genau das macht ihn interessant. Wenn er später Taron
  begegnet, lässt er ihn nicht aus Freundlichkeit entkommen, sondern weil er erkennt: Dieser falsche Held ist vielleicht
  die erste echte Chance, den alten König zurückzubekommen.

  Seine Beziehung zu Oswin kann stark werden: Beide haben viele der anderen Seite getötet, beide zählen nicht aus Stolz,
  sondern weil Vergessen schlimmer wäre. Am Anfang misstrauen sie einander. Später erkennen sie im anderen denselben Typ
  Kämpfer: müde, schuldig, zuverlässig. Sie werden kein lustiges Duo, eher zwei Männer, die im Kampf nebeneinander
  stehen und danach sehr wenig sagen müssen.

  Brokk spricht knapp, aber nicht dumm. Er hat trockenen Humor, weniger verspielt als der Erzähler, mehr wie Stein, der
  einmal im Jahr lächelt. Er ist praktisch, ehrenhaft, schwer und herzlich, wenn man lange genug wartet. Taron findet
  ihn zuerst natürlich furchtbar, weil Brokk ihn ernst nimmt, was Taron meist unangenehmer ist als Spott.
