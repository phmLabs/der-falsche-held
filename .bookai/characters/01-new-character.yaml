name: Der Erzähler
role: Mentor
traits: |-
  Der Erzähler ist eine Stimme, die nur Taron hören kann.
  In Tarons Kindheit war er eher ein Freund: ruhig, beschützend und nicht zynisch.
  Nach der Schlacht gegen die Zwerge verschwand die Stimme für zehn Jahre.
  Als Taron für den Auserwählten gehalten wird, kehrt sie plötzlich zurück.
  Heute klingt der Erzähler kühl, trocken, spöttisch und oft ziemlich gemein.
  Er kommentiert Tarons Leben, gibt manchmal hilfreiche Hinweise und manchmal absichtlich nervige oder falsche Aussagen.
  Taron ist deswegen oft wütend auf ihn, vertraut ihm aber widerwillig immer wieder.
  Der Erzähler weiß mehr, als er sagt, und weicht besonders Fragen über sein Verschwinden aus.
  Später soll sich herausstellen, dass er eine Art Schutzdämon des Auserwählten ist.
  Am Ende wird er behaupten, das ganze Chaos sei natürlich von Anfang an geplant gewesen.
backstory: ''
